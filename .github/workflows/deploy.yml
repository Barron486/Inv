name: Deploy to Cloud Run

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PROJECT_ID: iinv-476014
  REGION: asia-east1
  REPO: inv-repo
  SERVICE: invoice-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Google Auth
      id: auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker
      run: gcloud auth configure-docker

    - name: Build and Deploy
      run: |
        gcloud config set project $PROJECT_ID
        gcloud services enable run.googleapis.com artifactregistry.googleapis.com cloudbuild.googleapis.com vision.googleapis.com
        
        # Create repository if not exists
        gcloud artifacts repositories create $REPO --repository-format=docker --location=$REGION --description="Invoices App" || true
        
        # Build and push image
        gcloud builds submit --tag $REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$SERVICE
        
        # Deploy to Cloud Run
        gcloud run deploy $SERVICE \
          --image=$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$SERVICE \
          --platform=managed \
          --region=$REGION \
          --allow-unauthenticated \
          --min-instances=1 \
          --max-instances=3 \
          --memory=1Gi \
          --set-env-vars=EINV_BASE_URL=https://www.einvoice.nat.gov.tw/portal/ods/ODS318E/einvoice_open_data

    - name: Get Service URL
      run: |
        echo "Service URL:"
        gcloud run services describe $SERVICE --region=$REGION --format='value(status.url)'
