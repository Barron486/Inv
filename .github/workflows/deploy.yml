name: Deploy to Cloud Run

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PROJECT_ID: iinv-476014
  REGION: asia-east1
  REPO: inv-repo
  SERVICE: invoice-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Google Auth
      id: auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker
      run: gcloud auth configure-docker

    - name: Force Buildpacks (ignore Dockerfile)
      run: |
        if [ -f Dockerfile ]; then mv Dockerfile Dockerfile.ci.bak; fi
        echo "Listing root after potential rename:"
        ls -la

    - name: Build and Deploy
      run: |
        gcloud config set project $PROJECT_ID
        
        # 啟用必要的 API
        gcloud services enable run.googleapis.com cloudbuild.googleapis.com vision.googleapis.com serviceusage.googleapis.com
        gcloud services enable iam.googleapis.com cloudresourcemanager.googleapis.com storage.googleapis.com
        
        # 取得服務帳戶（執行與建置）
        PROJECT_NUMBER=$(gcloud projects describe $PROJECT_ID --format='value(projectNumber)')
        SA_COMPUTE="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
        # 使用 Compute Default 同時擔任建置與執行 SA，避免尚未建立的 Cloud Build SA 問題
        SA_BUILD="$SA_COMPUTE"
        
        # 使用原始碼部署，免 Dockerfile 和 Artifact Registry
        gcloud run deploy $SERVICE \
          --source . \
          --region=$REGION \
          --service-account="$SA_COMPUTE" \
          --build-service-account="$SA_BUILD" \
          --allow-unauthenticated \
          --min-instances=1 \
          --max-instances=3 \
          --memory=1Gi \
          --set-env-vars=EINV_BASE_URL=https://www.einvoice.nat.gov.tw/portal/ods/ODS318E/einvoice_open_data

    - name: Get Service URL
      run: |
        echo "Service URL:"
        gcloud run services describe $SERVICE --region=$REGION --format='value(status.url)'
